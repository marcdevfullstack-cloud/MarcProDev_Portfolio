# Régénère index.html à partir des contenus Supabase et le commite s'il a changé.
# Déclenché par le bouton « Publier » de l'admin, à la main depuis l'onglet
# Actions, et automatiquement quatre fois par jour.
name: Publier le portfolio

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Régénérer index.html
        run: node scripts/build.mjs
      - name: Commiter si le contenu a changé
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publication : contenus Supabase mis à jour"
          git push
