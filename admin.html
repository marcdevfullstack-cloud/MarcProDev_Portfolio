<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — MarcProDev</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #03060f; --surface: #0a1128; --surface2: #0d1535;
      --border: #162040; --border2: #1e2e58;
      --blue: #1a6bff; --blue-light: #4d8fff; --orange: #ff6b1a; --orange-light: #ff8a45;
      --green: #2fd58a; --red: #ff5a6e;
      --text: #eef2ff; --text2: #8fa3d4; --text3: #7d90bd;
      --font-body: 'Space Grotesk', sans-serif; --font-mono: 'DM Mono', monospace;
      --radius: 6px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.5; min-height: 100vh; }
    a { color: var(--blue-light); }
    button { font-family: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

    /* ─── Boutons ─── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.6rem 1.1rem; border-radius: var(--radius); border: 1px solid var(--border2);
      background: var(--surface2); color: var(--text); font-size: 0.88rem; font-weight: 600;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--blue-light); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, var(--blue), #0050d8); border-color: transparent; }
    .btn-danger { color: var(--red); }
    .btn-danger:hover { border-color: var(--red); }
    .btn-small { padding: 0.35rem 0.65rem; font-size: 0.8rem; }

    /* ─── Connexion / messages plein écran ─── */
    .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 2rem; }
    .card.wide { max-width: 620px; }
    .card h1 { font-size: 1.4rem; margin-bottom: 0.35rem; }
    .card p { color: var(--text2); font-size: 0.92rem; margin-bottom: 1rem; }
    .card ol { color: var(--text2); font-size: 0.92rem; padding-left: 1.2rem; display: grid; gap: 0.5rem; }
    code { font-family: var(--font-mono); font-size: 0.85em; background: rgba(255,255,255,0.06); padding: 0.1rem 0.35rem; border-radius: 3px; color: var(--text); }

    /* ─── Champs ─── */
    .field { display: grid; gap: 0.35rem; margin-bottom: 1.1rem; }
    .field label, .field .label { font-size: 0.8rem; font-weight: 600; color: var(--text2); letter-spacing: 0.02em; }
    .field .hint { font-size: 0.8rem; color: var(--text3); }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="url"], textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius);
      color: var(--text); font-family: inherit; font-size: 0.95rem; padding: 0.65rem 0.8rem;
    }
    textarea { resize: vertical; min-height: 5.5rem; line-height: 1.55; }
    input:focus, textarea:focus, select:focus { border-color: var(--blue-light); outline: none; }
    .check { display: flex; align-items: center; gap: 0.6rem; }
    .check input { width: 18px; height: 18px; accent-color: var(--blue); }
    .upload-row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .upload-row input[type="file"] { font-size: 0.82rem; color: var(--text2); max-width: 100%; }
    .preview { margin-top: 0.5rem; max-height: 180px; max-width: 140px; border-radius: 8px; border: 1px solid var(--border2); display: block; }

    /* ─── Mise en page admin ─── */
    .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .side { background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.25rem; }
    .side .brand { font-weight: 700; font-size: 1.05rem; padding: 0 0.6rem 1.25rem; }
    .side .brand span { color: var(--orange); }
    .side button.tab {
      text-align: left; background: none; border: none; color: var(--text2);
      padding: 0.6rem 0.75rem; border-radius: var(--radius); font-size: 0.92rem; font-weight: 500;
    }
    .side button.tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .side button.tab.active { color: var(--text); background: rgba(26,107,255,0.14); }
    .side .spacer { flex: 1; min-height: 1rem; }
    .side .who { font-size: 0.78rem; color: var(--text3); padding: 0 0.6rem 0.6rem; overflow-wrap: anywhere; }
    .main { padding: 2rem clamp(1rem, 4vw, 3rem); min-width: 0; }
    .main-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .main-head h1 { font-size: 1.5rem; }
    .main-head p { color: var(--text2); font-size: 0.9rem; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: clamp(1rem, 3vw, 1.75rem); max-width: 860px; }

    .rows { display: grid; gap: 0.5rem; max-width: 860px; }
    .row {
      display: flex; align-items: center; gap: 0.75rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem 0.9rem;
    }
    .row .thumb { width: 34px; height: 46px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border2); flex-shrink: 0; }
    .row .title { flex: 1; min-width: 0; }
    .row .title b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .title small { color: var(--text3); font-size: 0.8rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
    .badge { font-family: var(--font-mono); font-size: 0.68rem; padding: 0.1rem 0.4rem; border-radius: 3px; border: 1px solid var(--border2); color: var(--text3); margin-left: 0.4rem; }
    .empty { color: var(--text3); padding: 1.5rem; border: 1px dashed var(--border2); border-radius: 8px; max-width: 860px; }
    .form-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.5rem; }

    .muted { color: var(--text2); font-size: 0.92rem; }
    p.muted { margin-bottom: 1rem; max-width: 640px; }
    .side .sep { height: 1px; background: var(--border); margin: 0.6rem 0.4rem; }
    .badge.unread { color: #000; background: var(--orange); border-color: var(--orange); font-weight: 600; }
    .form-heading { font-size: 1.05rem; font-weight: 700; margin: 2rem 0 1.1rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    .form-heading:first-child, .form-heading.first { margin-top: 0; padding-top: 0; border-top: none; }

    .gallery { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .gallery:empty { display: none; }
    .gallery-item { display: grid; gap: 0.4rem; justify-items: center; }
    .gallery-item img { width: 84px; height: 130px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border2); }

    .message { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.1rem; display: grid; gap: 0.5rem; }
    .message.unread { border-color: rgba(255,107,26,0.45); }
    .message header { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: baseline; }
    .message p { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
    .message .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .message a { overflow-wrap: anywhere; }

    .stats-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .stats-table th, .stats-table td { text-align: left; padding: 0.7rem 0.6rem; border-bottom: 1px solid var(--border); }
    .stats-table thead th { font-size: 0.78rem; color: var(--text3); font-weight: 600; }
    .stats-table tbody th { font-weight: 500; color: var(--text2); }
    .stats-table td { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .qr { display: block; width: 190px; height: 190px; background: #fff; padding: 8px; border-radius: 8px; margin: 0.5rem 0 1rem; }

    .msg { padding: 0.7rem 0.9rem; border-radius: var(--radius); font-size: 0.9rem; margin-bottom: 1rem; border: 1px solid; }
    .msg.error { color: var(--red); border-color: rgba(255,90,110,0.4); background: rgba(255,90,110,0.08); }
    .msg.ok { color: var(--green); border-color: rgba(47,213,138,0.4); background: rgba(47,213,138,0.08); }
    #toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      padding: 0.7rem 1.1rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border2); z-index: 50; max-width: calc(100vw - 2rem);
    }
    #toast.error { border-color: var(--red); color: var(--red); }
    #toast.ok { border-color: var(--green); color: var(--green); }

    @media (max-width: 760px) {
      .shell { grid-template-columns: 1fr; }
      .side { flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); padding: 0.75rem; }
      .side .brand { width: 100%; padding: 0.25rem 0.5rem 0.5rem; }
      .side .spacer, .side .who { display: none; }
      .row { flex-wrap: wrap; }
      .row .actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div id="app"><div class="center"><p style="color:var(--text2)">Chargement…</p></div></div>
  <div id="toast" hidden role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
